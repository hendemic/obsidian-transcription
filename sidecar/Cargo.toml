[workspace]
resolver = "2"
members = ["crates/transcribe-core", "crates/engine-whispercpp", "crates/transcribe-cli"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
transcribe-core = { path = "crates/transcribe-core" }
engine-whispercpp = { path = "crates/engine-whispercpp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
log = "0.4"
whisper-rs = { version = "0.16", features = ["log_backend"] }
